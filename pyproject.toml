[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rxvision-research"
version = "0.1.0"
description = "Research tooling for auditable pill-image classification experiments"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Alphonso Woodbury" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
  "torch>=2.2,<3",
  "torchvision>=0.17,<1",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.30,<1",
]
data = [
  "pandas>=2.1,<4",
  "rawpy>=0.19,<1",
  "scikit-learn>=1.4,<2",
  "tqdm>=4.66,<5",
]
test = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
]

[project.urls]
Repository = "https://github.com/alphonsowoodbury/RxVision"
Issues = "https://github.com/alphonsowoodbury/RxVision/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rxvision*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --cov=rxvision --cov-report=term-missing"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
